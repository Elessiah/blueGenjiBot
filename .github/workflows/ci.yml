name: CI

on:
  pull_request:
    branches: [main]

# Une PR poussée deux fois de suite n'a pas besoin de deux exécutions : la
# précédente est annulée dès qu'une nouvelle démarre.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enchaînés par `needs:` plutôt qu'en parallèle : un lint rouge rend le reste
  # sans objet, et le build est un prérequis réel des tests (`node --test` lit
  # `dist/`, il n'y a pas de transpilation à la volée).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # `npm test` rebuild avant d'exécuter : les tests portent sur le build,
      # jamais sur les sources.
      - name: Run tests
        run: npm test
